name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Also run on macOS and Windows while the repository is private
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu only while the repository is private; macOS and Windows join when it is public or a manual run sets full_matrix.
        os: ${{ fromJSON((github.event.repository.visibility == 'public' || inputs.full_matrix) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test
      - name: Offline validation of every example
        run: node skills/validation/scripts/validate.mjs all examples --quiet
      - name: Manifest and skill checks
        run: node tools/check-manifests.mjs
      - name: Every script answers --help
        shell: bash
        run: |
          for s in skills/*/scripts/*.mjs; do
            node "$s" --help > /dev/null
          done
